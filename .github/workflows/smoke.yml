name: smoke
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - run: python3 -m py_compile scripts/aws_savings_scan.py
      - run: python3 tests/smoke_fake_account.py
      - name: no mutating API calls in the scanner
        run: |
          ! grep -nE '\.(delete|put|modify|stop|terminate|purchase|create|update|release|deregister|disable|enable)_[a-z_]+\(' scripts/aws_savings_scan.py
