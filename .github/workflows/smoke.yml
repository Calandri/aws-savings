name: smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - run: python3 -m py_compile scripts/aws_savings_scan.py
      - run: python3 tests/smoke_fake_account.py
      - name: no mutating API calls in the scanner
        run: |
          ! grep -nE '\.(delete|put|modify|stop|terminate|purchase|create|update|release|deregister|disable|enable)_[a-z_]+\(' scripts/aws_savings_scan.py
